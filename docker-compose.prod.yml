version: "3.8"
services: 
  nextjs:
    container_name: tok-web
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_YM_ID=95115536
    ports:
      - 3000:3000
  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
    volumes:
       - ./nginx/conf:/etc/nginx/conf.d
       - ./certbot/www:/var/www/certbot

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt/ssl
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email tok-mebel.cloud@yandex.ru --agree-tos --no-eff-email --staging -d tok-mebel.ru -d www.tok-mebel.ru
